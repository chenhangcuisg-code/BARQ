<style>
:root{color-scheme:dark;--line:#1d2c55;--ink:#e9f2ff;--dim:#8fa4cc;--acc:#38e1ff;
  --disp:"Chakra Petch","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",Consolas,"Courier New",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden}
.theater{position:fixed;inset:0;background:#000}
.theater canvas{display:block;width:100%;height:100%;object-fit:contain;cursor:pointer}
.big-play{position:absolute;left:50%;top:calc(50% + min(28vh, 15.75vw));transform:translate(-50%,-50%);width:84px;height:84px;padding:0;border-radius:50%;border:1px solid #38e1ff66;background:#060c1cb0;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
.big-play[hidden]{display:none}
.big-play:hover{border-color:var(--acc);box-shadow:0 0 28px #38e1ff55}
.big-play .tri{width:64px;height:64px;border-radius:50%;background:var(--acc);display:grid;place-items:center}
.big-play .tri::before{content:"";border-left:20px solid #04101c;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
#bigtxt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.controls{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:28px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.78));transition:opacity .35s}
.ctl{height:40px;min-width:40px;padding:0 10px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid #ffffff22;background:#0b1226cc;color:var(--ink);font:600 13px var(--mono);cursor:pointer}
.ctl:hover{border-color:var(--acc)}
.ctl svg{display:block}
.big-play:focus-visible,.ctl:focus-visible,.scrub input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.clock{font:500 13px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;min-width:96px}
.scrub{position:relative;flex:1 1 200px;min-width:120px;height:30px;display:flex;align-items:center}
.scrub input{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:30px;margin:0;cursor:pointer}
.scrub input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc) var(--pct,0%),#ffffff2e var(--pct,0%))}
.scrub input::-moz-range-track{height:6px;border-radius:3px;background:#ffffff2e}
.scrub input::-moz-range-progress{height:6px;border-radius:3px;background:var(--acc)}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:var(--ink);border:0}
.scrub input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:0}
.ticks{position:absolute;left:8px;right:8px;top:50%;height:12px;transform:translateY(-50%);pointer-events:none}
.ticks i{position:absolute;top:0;width:2px;height:12px;margin-left:-1px;background:#000}
.theater.idle .controls{opacity:0;pointer-events:none}
.theater.idle{cursor:none}
.theater.idle canvas{cursor:none}
@media (max-width:560px){.clock{min-width:auto}.big-play{width:64px;height:64px}.big-play .tri{width:48px;height:48px}.controls{gap:8px;padding:24px 10px 10px}}
@media (prefers-reduced-motion:reduce){.controls{transition:none}}
</style>

/* ============ math ============ */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,k)=>a+(b-a)*k;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const H1=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const win=(t,a,b,fi=.4,fo=.4)=>Math.min(P(t,a,a+fi),1-P(t,b-fo,b));
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};
const rgb=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];};
const mix=(h1,h2,k,a=1)=>{const p=rgb(h1),q=rgb(h2);return `rgba(${Math.round(lerp(p[0],q[0],k))},${Math.round(lerp(p[1],q[1],k))},${Math.round(lerp(p[2],q[2],k))},${a})`;};
const chIdx=t=>{let ci=0;SC.forEach((c,i)=>{if(t>=c.F0)ci=i;});return ci;};
function camAt(K,v){if(v<=K[0][0])return K[0].slice(1);for(let i=0;i<K.length-1;i++){const a=K[i],b=K[i+1];if(v<b[0]){const k=eio((v-a[0])/(b[0]-a[0]));return [lerp(a[1],b[1],k),lerp(a[2],b[2],k),lerp(a[3],b[3],k)];}}return K[K.length-1].slice(1);}
function cam(K,v){const [s,x,y]=camAt(K,v);ctx.setTransform(s,0,0,s,W/2-x*s,H/2-y*s);}
function screen(){ctx.setTransform(1,0,0,1,0,0);}

/* ============ drawing primitives ============ */
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function box(x,y,w,h,r,fill,stroke,lw=2,glow=0,dash){rr(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.save();if(glow){ctx.shadowColor=stroke;ctx.shadowBlur=glow;}if(dash)ctx.setLineDash(dash);ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();ctx.restore();}}
function tx(s,x,y,font,col,al='left',bl='alphabetic'){ctx.font=font;ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline=bl;ctx.fillText(s,x,y);}
function gtx(s,x,y,font,col,al='left',g=16,gc){ctx.save();ctx.shadowColor=gc||col;ctx.shadowBlur=g;tx(s,x,y,font,col,al);ctx.restore();}
function mw(s,font){ctx.font=font;return ctx.measureText(s).width;}
function fade(a,f){if(a<=0.002)return;ctx.save();ctx.globalAlpha*=Math.min(1,a);f();ctx.restore();}
function wrap(s,font,maxW){ctx.font=font;const out=[];let cur='';for(const w of s.split(' ')){const test=cur?cur+' '+w:w;if(ctx.measureText(test).width>maxW&&cur){out.push(cur);cur=w;}else cur=test;}if(cur)out.push(cur);return out;}
function para(s,x,y,font,col,maxW,lh){wrap(s,font,maxW).forEach((l,i)=>tx(l,x,y+i*lh,font,col));}
function line(x1,y1,x2,y2,col,lw=2,dash){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}
function arrowHead(x,y,ang,sz,col){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(sz,0);ctx.lineTo(-sz*.7,sz*.7);ctx.lineTo(-sz*.7,-sz*.7);ctx.closePath();ctx.fill();ctx.restore();}
function arrow(x1,y1,x2,y2,col,lw=3){line(x1,y1,x2,y2,col,lw);arrowHead(x2,y2,Math.atan2(y2-y1,x2-x1),lw*3,col);}
function brackets(x,y,w,h,L,col,lw=2){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;[[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([px,py,sx,sy])=>{ctx.beginPath();ctx.moveTo(px,py+sy*L);ctx.lineTo(px,py);ctx.lineTo(px+sx*L,py);ctx.stroke();});ctx.restore();}
function pill(s,x,y,fs,col,o={}){const F=FM(fs,o.w||700),w=mw(s,F)+fs*1.1,h=fs*1.7,x0=o.left?x:o.right?x-w:x-w/2;box(x0,y-h/2,w,h,h*.3,o.fill||hexA(col,.16),col,2,o.glow===undefined?12:o.glow);tx(s,x0+w/2,y+fs*.36,F,o.color||C.ink,'center');return w;}
function check(x,y,s,col,lw){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw||s*.22;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x-s*.45,y);ctx.lineTo(x-s*.12,y+s*.32);ctx.lineTo(x+s*.48,y-s*.36);ctx.stroke();ctx.restore();}
function cross(x,y,s,col,lw){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw||s*.22;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-s*.4,y-s*.4);ctx.lineTo(x+s*.4,y+s*.4);ctx.moveTo(x+s*.4,y-s*.4);ctx.lineTo(x-s*.4,y+s*.4);ctx.stroke();ctx.restore();}
function bolt(x1,y1,x2,y2,seed,col,lw=4){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.shadowColor=col;ctx.shadowBlur=22;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x1,y1);const n=9;for(let i=1;i<n;i++){const k=i/n;ctx.lineTo(lerp(x1,x2,k)+(H1(seed+i)-.5)*90,lerp(y1,y2,k));}ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}
function stamp(s,x,y,rot,k,col){if(k<=0)return;const sc=lerp(2.2,1,eo(clamp(k*3)));fade(clamp(k*4),()=>{ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);const F=FD(54,700),w=mw(s,F)+56;ctx.shadowColor=col;ctx.shadowBlur=20;box(-w/2,-46,w,84,10,'rgba(5,9,20,0.82)',col,5);ctx.shadowBlur=0;tx(s,0,19,F,col,'center');ctx.restore();});}

/* math typesetting: parts are [text, style] with style '' roman, 'i' italic, '_' subscript, '^' superscript */
function math(parts,x,y,s,col=C.ink,al='left'){
  const f=st=>st==='_'||st==='^'?FX(s*.6,true):FX(s,st==='i');

  parts.forEach(([t,st])=>{const dy=st==='_'?s*.3:st==='^'?-s*.42:0;tx(t,xx,y+dy,f(st),col);xx+=mw(t,f(st))+(st==='_'||st==='^'?2:0);});return tot;}

let A=null,master=null,rev=null,DLY=null,NOISE=null,sess=null,muted=false;

function buildGraph(gain){
  const comp=A.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.18;
  AN=A.createAnalyser();AN.fftSize=256;

  rev=A.createConvolver();const n=Math.floor(A.sampleRate*2.4),ib=A.createBuffer(2,n,A.sampleRate);
  for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<n;i++)d[i]=(H1(i*.37+c*91)*2-1)*Math.pow(1-i/n,2.6);}
  rev.buffer=ib;const rg=A.createGain();rg.gain.value=.45;rev.connect(rg);rg.connect(master);
  DLY=A.createDelay(1);DLY.delayTime.value=BEAT*.75;const fb=A.createGain();fb.gain.value=.32;const dl=A.createBiquadFilter();dl.type='lowpass';dl.frequency.value=3200;
  DLY.connect(dl);dl.connect(fb);fb.connect(DLY);const dg=A.createGain();dg.gain.value=.5;dl.connect(dg);dg.connect(master);
  NOISE=A.createBuffer(1,A.sampleRate*2,A.sampleRate);const nd=NOISE.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=H1(i*.731+5)*2-1;
}
function initAudio(){try{A=new (window.AudioContext||window.webkitAudioContext)();}catch(e){A=null;return;}buildGraph(muted?0:.8);}
function newSession(){const dry=A.createGain(),wet=A.createGain(),dly=A.createGain();dry.connect(master);wet.connect(rev);dly.connect(DLY);sess={dry,wet,dly};}
function killSession(){if(!sess||!A)return;const s=sess;sess=null;const n=A.currentTime;[s.dry,s.wet,s.dly].forEach(g=>{g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(g.gain.value,n);g.gain.linearRampToValueAtTime(0,n+.06);});setTimeout(()=>{try{s.dry.disconnect();s.wet.disconnect();s.dly.disconnect();}catch(e){}},250);}
function osc(type,f,w,end){const o=A.createOscillator();o.type=type;o.frequency.setValueAtTime(f,w);o.start(w);o.stop(end);return o;}
function genv(w,a,peak,d){const g=A.createGain();g.gain.setValueAtTime(.0001,w);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),w+a);g.gain.exponentialRampToValueAtTime(.0001,w+a+d);return g;}

function out(S,node,dry,wet,dly){if(dry){const g=A.createGain();g.gain.value=dry;node.connect(g);g.connect(S.dry);}if(wet){const g=A.createGain();g.gain.value=wet;node.connect(g);g.connect(S.wet);}if(dly){const g=A.createGain();g.gain.value=dly;node.connect(g);g.connect(S.dly);}}
function filt(type,f,q){const b=A.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;return b;}

const CH_A=[{b:45,p:[57,60,64,67]},{b:41,p:[53,57,60,64]},{b:48,p:[55,59,60,64]},{b:43,p:[55,59,62,64]}];
const CH_B=[{b:45,p:[57,60,64,67]},{b:41,p:[53,57,60,64]},{b:38,p:[53,57,60,62]},{b:40,p:[52,56,59,62]}];
const CH_C=[{b:48,p:[55,60,64,67]},{b:43,p:[55,59,62,67]},{b:45,p:[57,60,64,69]},{b:41,p:[57,60,65,69]}];
const CH_R=[{b:41,p:[53,57,60,65]},{b:43,p:[55,59,62,67]},{b:40,p:[55,59,62,64]},{b:45,p:[57,60,64,69]}];
const CMAJ9={b:36,p:[52,55,59,62]};
const chordAt=b=>b<10?CH_A[b%4]:b<17?CH_B[(b-10)%4]:b<37?CH_C[(b-17)%4]:b<48?CH_R[(b-37)%4]:CMAJ9;
const secAt=b=>b<4?'in':b<10?'a':b<17?'prob':b<37?'build':b<48?'res':'out';
function buildScore(){
  const E=[],at=(t,f)=>E.push({t,f});
  for(let b=0;b<52;b++){
    const t0=b*BAR,ch=chordAt(b),sec=secAt(b),bt=k=>t0+k*BEAT;
    const fillBar=b===16||b===36,drums=b>=4&&b<48,full=drums&&b>=6&&sec!=='prob';
    if(b<48)at(t0,(S,w)=>INS.pad(S,w,ch.p,BAR,sec==='in'?.8:sec==='prob'?.85:1,full&&!fillBar));
    else if(b===48)at(t0,(S,w)=>INS.pad(S,w,ch.p.concat([60,67]),7.6,1.1,false));
    if(b<48&&!fillBar){
      const p=ch.p,tones=[p[0],p[1],p[2],p[3],p[0]+12,p[3],p[2],p[1]];
      const oct=sec==='build'||sec==='res'?12:0,cut=sec==='in'?500+b*500:sec==='prob'?1800:sec==='a'?2400:3200,step=sec==='prob'?2:1;
      for(let k=0;k<16;k+=step){const m=tones[(sec==='prob'?k*3:k)%8]+oct,vv=(k%4===0?1:.7)*(b<2?.6:1);at(bt(k/4),(S,w)=>INS.arp(S,w,m,cut,vv));}
    }
    if(drums){
      if(fillBar){[0,1,2].forEach(k=>at(bt(k),(S,w)=>INS.kick(S,w,.8)));[3,3.25,3.5,3.75].forEach((k,i)=>at(bt(k),(S,w)=>INS.kick(S,w,.4+i*.14)));at(t0,(S,w)=>INS.riser(S,w,BAR-.05));}
      else{
        for(let k=0;k<4;k++)at(bt(k),(S,w)=>INS.kick(S,w,sec==='prob'?.75:1));
        if(full){at(bt(1),(S,w)=>INS.clap(S,w,1));at(bt(3),(S,w)=>INS.clap(S,w,1));}
        for(let k=0;k<4;k++)at(bt(k+.5),(S,w)=>INS.hat(S,w,.85));
        if(full&&(sec==='build'||sec==='res'))for(let k=0;k<4;k++){at(bt(k+.25),(S,w)=>INS.hat(S,w,.3));at(bt(k+.75),(S,w)=>INS.hat(S,w,.35));}
      }
    }
    if(full&&!fillBar){const r=ch.b;for(let k=0;k<4;k++)at(bt(k+.5),(S,w)=>INS.bass(S,w,r,BEAT*.45,1));if(sec==='build'||sec==='res')for(let k=0;k<4;k++)at(bt(k+.75),(S,w)=>INS.bass(S,w,r+12,BEAT*.2,.45));}
    if(sec==='prob'&&!fillBar)at(t0,(S,w)=>INS.bass(S,w,ch.b,BAR*.95,.7));
    if(sec==='res'&&b%2===1)at(t0,(S,w)=>INS.bell(S,w,ch.p[3]+12,.5));
    if(b===48){[72,76,79,83,86].forEach((m,i)=>at(t0+i*BEAT*.5,(S,w)=>INS.bell(S,w,m,.85)));at(t0,(S,w)=>INS.bass(S,w,36,3.6,.8));}
  }
  const fx=(t,f)=>at(t,f);
  GL.forEach(g=>fx(g-.06,(S,w)=>INS.glitch(S,w)));
  /* 00 */
  for(let i=0;i<8;i++)fx(.2+i*.2,(S,w)=>INS.tick(S,w,.6,i));
  [2.4,3.0,3.6].forEach((x,i)=>fx(x,(S,w)=>{INS.thud(S,w);INS.blip(S,w,76-i*5,.6);}));fx(3.7,(S,w)=>INS.buzz(S,w));
  fx(3.4,(S,w)=>INS.riser(S,w,1.5));fx(4.95,(S,w)=>{INS.thunder(S,w);INS.zap(S,w);INS.bell(S,w,84,.7);});
  for(let i=0;i<14;i++)fx(5.5+i*.08,(S,w)=>INS.key(S,w,.5,i));fx(8,(S,w)=>INS.impact(S,w,.7));
  /* 01 */
  for(let i=0;i<12;i++)fx(8.9+i*.05,(S,w)=>INS.tick(S,w,.6,i+10));fx(10.6,(S,w)=>INS.snip(S,w));fx(11.5,(S,w)=>INS.buzz(S,w));
  fx(12.0,(S,w)=>INS.pop(S,w,.6));fx(12.8,(S,w)=>INS.whoosh(S,w,1.2,.6));
  for(let k=0;k<16;k++)fx(14.6+k*.07,(S,w)=>INS.blip(S,w,72+(k%5)*2,.5));fx(16.0,(S,w)=>INS.whoosh(S,w,.9,.4));
  [17.0,17.45,17.9,18.35].forEach((x,i)=>fx(x,(S,w)=>INS.pop(S,w,.5+i*.1)));fx(18.4,(S,w)=>INS.bell(S,w,84,.6));
  /* 02: one tick per fitting step, a sigh when a codeword falls asleep */
  for(let i=0;i<15;i++)fx(21.2+i*.48,(S,w)=>INS.tick(S,w,.7,i+30));
  IDLE.forEach((k,j)=>fx(20+1.2+(IDLE_SINCE[k]+.2)/15*7.2+j*.03,(S,w)=>INS.sleep(S,w)));
  fx(29.0,(S,w)=>INS.thud(S,w));fx(29.5,(S,w)=>INS.bell(S,w,69,.5));fx(30.6,(S,w)=>INS.buzz(S,w));
  /* 03 */
  [34.5,34.95,35.4].forEach(x=>fx(x,(S,w)=>INS.pop(S,w,.6)));fx(36.4,(S,w)=>INS.whoosh(S,w,1.4,.5));fx(37.6,(S,w)=>INS.bell(S,w,79,.6));
  for(let i=0;i<12;i++)fx(38.4+i*.2,(S,w)=>INS.tick(S,w,.6,i+60));fx(40.6,(S,w)=>INS.bell(S,w,84,.5));
  /* 04: every Sinkhorn step is a note */
  fx(42,(S,w)=>INS.impact(S,w,.6));
  ITS.forEach(([a,b],i)=>{fx(42+a,(S,w)=>INS.blip(S,w,72+Math.min(i,12),i<3?.8:.4));if(i<3)fx(42+(a+b)/2,(S,w)=>INS.blip(S,w,79+i,.6));});
  fx(50.8,(S,w)=>{INS.bell(S,w,84,.7);INS.bell(S,w,91,.4);});fx(52.0,(S,w)=>INS.whoosh(S,w,1.0,.6));
  [53.9,54.0,54.1,54.2].forEach((x,i)=>fx(x,(S,w)=>{INS.pop(S,w,.8);INS.bell(S,w,84+i*3,.4);}));
  /* 05 */
  fx(57.2,(S,w)=>INS.whoosh(S,w,3.2,.5));fx(60.6,(S,w)=>INS.bell(S,w,84,.6));fx(61.4,(S,w)=>INS.thud(S,w));
  /* 06 */
  fx(64.7,(S,w)=>INS.glitch(S,w));fx(65.0,(S,w)=>INS.thud(S,w));for(let i=0;i<8;i++)fx(66.0+i*.14,(S,w)=>INS.tick(S,w,.6,i+90));
  fx(66.4,(S,w)=>INS.whoosh(S,w,1.4,.4));fx(67.6,(S,w)=>INS.bell(S,w,79,.5));fx(68.6,(S,w)=>{INS.impact(S,w,.6);INS.bell(S,w,88,.6);});
  [70.9,71.3,71.7,72.1].forEach(x=>fx(x,(S,w)=>INS.pop(S,w,.7)));fx(72.6,(S,w)=>INS.bell(S,w,91,.5));
  /* 07: tile flips */
  fx(74,(S,w)=>INS.impact(S,w,.7));
  TIL.forEach(T=>{fx(74+1.0+T.idx*.055,(S,w)=>INS.blip(S,w,T.pg?79:62,.35));fx(74+5.4+T.idx*.04,(S,w)=>INS.tick(S,w,T.ag?.5:.25,T.idx));});
  fx(82.3,(S,w)=>{INS.impact(S,w,.6);INS.bell(S,w,84,.7);INS.bell(S,w,88,.5);});fx(82.6,(S,w)=>INS.whoosh(S,w,.8,.5));
  /* 08 */
  fx(86.9,(S,w)=>INS.whoosh(S,w,1.8,.5));for(let i=0;i<8;i++)fx(87.6+i*.18,(S,w)=>INS.tick(S,w,.5,i+150));
  for(let i=0;i<6;i++)fx(90.0+i*.22,(S,w)=>INS.pop(S,w,.6));fx(91.4,(S,w)=>INS.bell(S,w,84,.6));
  /* 09 */
  fx(96.3,(S,w)=>INS.whoosh(S,w,1.0,.5));
  CMD.forEach((s,i)=>{for(let j=0;j<s.length;j+=2)fx(96+1.3+i*1.3+j/s.length*1.1,(S,w)=>INS.key(S,w,.45,j+i*80));});
  fx(99.8,(S,w)=>INS.bell(S,w,88,.5));
  E.sort((a,b)=>a.t-b.t);return E;
}
const EV=buildScore();

/* offline render of the score, for the MP4 */
let WAV=null;
async function renderAudio(){
  const sr=44100,OA=new OfflineAudioContext(2,Math.ceil(sr*DUR),sr),keep=[A,master,rev,DLY,NOISE,sess,AN];
  A=OA;buildGraph(.8);newSession();
  for(const e of EV){try{e.f(sess,Math.max(.001,e.t));}catch(err){}}
  const buf=await OA.startRendering();
  [A,master,rev,DLY,NOISE,sess,AN]=keep;
  const L=buf.getChannelData(0),R=buf.getChannelData(1),n=L.length,ab=new ArrayBuffer(44+n*4),dv=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*4,true);
  let peak=0;for(let i=0;i<n;i++){peak=Math.max(peak,Math.abs(L[i]),Math.abs(R[i]));}
  const g=peak>0.98?0.98/peak:1;
  for(let i=0;i<n;i++){dv.setInt16(44+i*4,clamp(L[i]*g,-1,1)*32767,true);dv.setInt16(46+i*4,clamp(R[i]*g,-1,1)*32767,true);}
  WAV=new Uint8Array(ab);return {bytes:WAV.length,peak};
}
function wavChunk(i,size){const s=WAV.subarray(i*size,(i+1)*size);let bin='';for(let j=0;j<s.length;j+=32768)bin+=String.fromCharCode.apply(null,s.subarray(j,j+32768));return btoa(bin);}

let started=false,pausedAt=POSTER,filmStart=0,ctxStart=0,evIdx=0,dragging=false;
const clock=()=>A?A.currentTime:performance.now()/1000;
const filmNow=()=>playing?filmStart+(clock()-ctxStart):pausedAt;
const lowerBound=t=>{let i=0;while(i<EV.length&&EV[i].t<t-.001)i++;return i;};
function schedule(now){
  if(!A||!sess)return;
  while(evIdx<EV.length&&EV[evIdx].t<now+.25){const e=EV[evIdx++],w=ctxStart+(e.t-filmStart);if(w<A.currentTime-.03)continue;try{e.f(sess,Math.max(w,A.currentTime+.005));}catch(err){}}
}
function play(from){
  if(!A)initAudio();
  if(A&&A.state==='suspended')A.resume();
  const t0=from!==undefined?clamp(from,0,DUR-.05):(started&&pausedAt<DUR-.05?pausedAt:0);
  started=true;
  if(A){killSession();newSession();}
  filmStart=t0;ctxStart=clock();evIdx=lowerBound(t0);playing=true;
  if(A&&sess){const b=Math.floor(t0/BAR),o=t0-b*BAR;if(o>.15&&b<48)INS.pad(sess,A.currentTime+.01,chordAt(b).p,BAR-o,.6);}
  refreshUI();
}
function pause(){pausedAt=filmNow();playing=false;killSession();refreshUI();}
function toggle(){playing?pause():play();}
function seek(t){t=clamp(t,0,DUR);if(playing)play(t);else{pausedAt=t;started=true;refreshUI();}}

});
function refreshUI(){
  ppBtn.innerHTML=playing?ICO.pause:ICO.play;ppBtn.setAttribute('aria-label',playing?'Pause':'Play');
  sndBtn.innerHTML=muted?ICO.mute:ICO.snd;sndBtn.setAttribute('aria-label',muted?'Unmute':'Mute');
  ccBtn.textContent=capOn?'CC on':'CC off';ccBtn.setAttribute('aria-pressed',capOn?'true':'false');
  big.hidden=playing;
  const t=filmNow();
  bigTxt.innerHTML=!started?'Play the film<small>1:44 · turn sound on</small>':t>=DUR-.05?'Watch again<small>from the beginning</small>':'Resume<small>'+fmt(t)+' / '+fmt(DUR)+'</small>';
  if(!playing)playerEl.classList.remove('idle');else wake();
}
let lastSec=-1;
function syncUI(t){
  if(!dragging)seekEl.value=t;
  seekEl.style.setProperty('--pct',(t/DUR*100)+'%');
  const s=Math.floor(t);if(s!==lastSec){lastSec=s;clockEl.textContent=fmt(t)+' / '+fmt(DUR);}
}
let external=false;
function frame(){
  if(!external){
    let t=filmNow();
    if(playing&&t>=DUR){t=DUR;playing=false;pausedAt=DUR;refreshUI();}
    if(playing)schedule(t);
    render(started?t:POSTER);
    syncUI(started?t:0);
  }
  requestAnimationFrame(frame);
}
setInterval(()=>{if(playing)schedule(filmNow());},50);
big.addEventListener('click',()=>play());
ppBtn.addEventListener('click',toggle);
cv.addEventListener('click',toggle);
seekEl.addEventListener('input',()=>{dragging=true;seek(parseFloat(seekEl.value));});
seekEl.addEventListener('change',()=>{dragging=false;});
ccBtn.addEventListener('click',()=>{capOn=!capOn;try{localStorage.setItem('barq-cc',capOn?'on':'off');}catch(e){}refreshUI();});
function setMute(v){muted=v;if(master&&A&&A.currentTime!==undefined&&A.state!==undefined)master.gain.setTargetAtTime(muted?0:.8,A.currentTime,.02);try{localStorage.setItem('barq-mute',muted?'1':'0');}catch(e){}refreshUI();}
sndBtn.addEventListener('click',()=>setMute(!muted));
function toggleFS(){try{if(document.fullscreenElement)document.exitFullscreen();else{const p=playerEl.requestFullscreen&&playerEl.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}}catch(e){}}
fsBtn.addEventListener('click',toggleFS);
let idleT=0;
function wake(){playerEl.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>{if(playing)playerEl.classList.add('idle');},2500);}
['mousemove','pointerdown','touchstart','keydown'].forEach(ev=>(ev==='keydown'?document:playerEl).addEventListener(ev,wake,{passive:true}));
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT'&&e.target!==seekEl)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(k===' '||k==='k'||k==='K'){e.preventDefault();toggle();}
  else if(k==='ArrowRight'){e.preventDefault();seek(filmNow()+5);}
  else if(k==='ArrowLeft'){e.preventDefault();seek(filmNow()-5);}
  else if(k>='0'&&k<='9'){play(SC[+k].F0+.01);}
  else if(k==='f'||k==='F'){toggleFS();}
  else if(k==='m'||k==='M'){setMute(!muted);}
  else if(k==='c'||k==='C'){ccBtn.click();}
});
/* hooks for the offline renderer */
window.__barq={render,teaser,TL,DUR,POSTER,SC,mode:o=>{Object.assign(MODE,o);external=true;},renderAudio,wavChunk};
refreshUI();
if(document.fonts&&document.fonts.load)['700 40px "Chakra Petch"','600 40px "Chakra Petch"','500 40px "JetBrains Mono"','700 40px "JetBrains Mono"','600 40px Figtree','500 40px Figtree','italic 500 40px "STIX Two Text"','500 40px "STIX Two Text"'].forEach(f=>document.fonts.load(f).catch(()=>{}));
requestAnimationFrame(frame);
})();
</script>
